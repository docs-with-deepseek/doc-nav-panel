  <line x1="10" y1="3" x2="10" y2="29" stroke="currentColor" stroke-width="1"/>
  <line x1="5" y1="8" x2="9" y2="8" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <line x1="5" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <line x1="5" y1="16" x2="9" y2="16" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <!-- Right page -->
  <rect x="24" y="3" width="4" height="26" rx="0.5" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="14" y="10" width="14" height="2" rx="0.5" fill="currentColor" stroke-width="0.8" opacity="0.3"/>
  <rect x="14" y="14" width="12" height="2" rx="0.5" fill="currentColor" stroke-width="0.8" opacity="0.25"/>
